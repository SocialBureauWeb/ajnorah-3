services:
  - type: web
    name: ajinorah-backend
    env: node
    nodeVersion: 18
    branch: main
    plan: free
    region: oregon
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    path: backend
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.ajinorahworldwide.com
